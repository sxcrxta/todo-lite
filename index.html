<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>todo-lite</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/theme-boot.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="pwa/apple-touch-icon.png">
<meta name="theme-color" content="#e7effc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="할 일">
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))</script>
<link rel="icon" href="pwa/icon-192.png">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1 class="app-title">할 일</h1>
      <button type="button" id="theme-toggle" class="btn" aria-pressed="false">다크 모드</button>
    </header>

    <div class="add-row">
      <input type="text" id="new-todo" class="new-todo" aria-label="새 할 일" placeholder="예: 우유 사기" autocomplete="off">
      <button type="button" id="add-btn" class="btn btn-primary">추가</button>
    </div>

    <div class="filters" role="group" aria-label="필터">
      <button type="button" class="btn filter-btn" data-filter="all" aria-pressed="true">전체</button>
      <button type="button" class="btn filter-btn" data-filter="active" aria-pressed="false">진행중</button>
      <button type="button" class="btn filter-btn" data-filter="completed" aria-pressed="false">완료</button>
    </div>

    <p id="storage-warning" class="storage-warning" role="status" hidden></p>

    <ul id="todo-list" class="todo-list"></ul>
  </main>
  <script src="js/view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
